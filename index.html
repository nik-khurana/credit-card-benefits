<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Maximizer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="glass-container">
    <header>
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        Reward Maximizer
      </h1>
      <div class="status">AI Online</div>
    </header>

    <div id="chat-messages">
      <div class="message ai">
        <div class="markdown-body">
          <p>Hi there! I'm your credit card rewards assistant. Ask me anything like:</p>
          <ul>
            <li>"What card should I use for dining today?"</li>
            <li>"What are the benefits of my Chase Sapphire Preferred?"</li>
            <li>"I'm booking a flight, which card is best?"</li>
          </ul>
        </div>
      </div>
    </div>

    <form id="chat-form" class="input-area">
      <input type="text" id="user-input" placeholder="Ask about maximizing your rewards..." required autocomplete="off">
      <button type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
