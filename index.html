<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Maximizer</title>
  <link rel="stylesheet" href="/css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div class="glass-container" id="chat-container">
    <header>
      <h1>
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="5" width="20" height="14" rx="2"></rect>
          <line x1="2" y1="10" x2="22" y2="10"></line>
        </svg>
        Reward Maximizer
      </h1>
      
      <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end;">
        <select id="category-select" style="background: rgba(0,0,0,0.4); color: white; border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; outline: none; cursor: pointer; max-width: 180px; text-overflow: ellipsis;">
          <option value="">Spending on...</option>
          <option value="Dining / Restaurants">Dining</option>
          <option value="Groceries / Supermarkets">Groceries</option>
          <option value="Gas Stations">Gas Stations</option>
          <option value="Travel / Flights / Hotels">Travel</option>
          <option value="Online Shopping">Online Shopping</option>
          <option value="Drugstores">Drugstores</option>
          <option value="Amazon.com">Amazon.com</option>
          <option value="Everything Else (Non-category)">Everything Else</option>
        </select>
        
        <select id="benefits-select" style="background: rgba(0,0,0,0.4); color: white; border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 12px; font-size: 0.85rem; outline: none; cursor: pointer; max-width: 180px; text-overflow: ellipsis;">
          <option value="">View Card Benefits...</option>
          <!-- Options injected via JS -->
        </select>
        
        <button id="theme-toggle" style="background: transparent; color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 10px; cursor: pointer;" aria-label="Toggle Theme">
          <svg id="theme-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        
        <button onclick="window.location.href='/admin.html'" style="background: transparent; color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 10px; cursor: pointer;">
          Admin
        </button>
      </div>
    </header>

    <div id="chat-messages">
      <div class="message ai">
        <div class="markdown-body">
          <p>Hi there! I'm your credit card rewards assistant. Ask me anything like:</p>
          <ul>
            <li>"What card should I use for dining today?"</li>
            <li>"What are the benefits of my Chase Sapphire Preferred?"</li>
            <li>"I'm booking a flight, which card is best?"</li>
          </ul>
        </div>
      </div>
    </div>

    <form id="chat-form" class="input-area">
      <input type="text" id="user-input" placeholder="Ask about maximizing your rewards..." required autocomplete="off">
      <button type="submit" aria-label="Send message">
        <svg viewBox="0 0 24 24">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
        </svg>
      </button>
    </form>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
