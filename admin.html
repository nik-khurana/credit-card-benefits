<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Reward Maximizer</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    .passcode-input {
      width: 100%;
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 8px;
      padding: 12px 16px;
      color: white;
      outline: none;
      margin-bottom: 16px;
    }
    .passcode-input:focus {
      border-color: var(--primary);
    }
  </style>
</head>
<body>
  
  <div id="login-overlay" class="login-overlay">
    <div class="login-box" style="position: relative;">
      <button onclick="window.location.href='/'" style="position: absolute; top: 24px; left: 24px; background: transparent; color: var(--text-muted); border: none; cursor: pointer;" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </button>
      <h2>Admin Access</h2>
      <p style="margin-bottom: 24px; color: var(--text-muted); font-size: 0.9rem;">Please enter the passcode to manage your credit cards.</p>
      <form id="login-form">
        <input type="password" id="passcode-input" class="passcode-input" placeholder="Enter Passcode" required>
        <button type="submit" class="login-btn">Unlock</button>
      </form>
      <p id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-top: 12px; display: none;"></p>
    </div>
  </div>

  <div class="glass-container hidden" id="admin-panel">
    <header>
      <div style="display: flex; gap: 12px; align-items: center;">
        <button onclick="window.location.href='/'" style="background: transparent; color: var(--text-main); border: 1px solid var(--glass-border); border-radius: 8px; padding: 6px 12px; cursor: pointer; display: flex; align-items: center; gap: 6px;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
          Back
        </button>
        <h1 style="margin: 0; font-size: 1.25rem;">Manage Cards</h1>
      </div>
      <button id="logout-btn" class="btn-remove" style="border-color: var(--glass-border); color: var(--text-main);">Lock</button>
    </header>

    <div style="flex: 1; padding: 24px; overflow-y: auto;">
      <div class="admin-header">
        <h2>Your Portfolio</h2>
        <p>These cards will be analyzed by the AI when you ask for recommendations.</p>
      </div>

      <div id="card-list" class="card-list">
        <!-- Cards injected here via JS -->
      </div>

      <form id="add-card-form" class="add-card-form">
        <input type="text" id="new-card-input" placeholder="e.g., Chase Sapphire Reserve" required>
        <button type="submit">Add Card</button>
      </form>
    </div>
  </div>

  <script src="/js/admin.js"></script>
</body>
</html>
